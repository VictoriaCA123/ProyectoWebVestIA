<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración inicial: Meta tags, Favicon y estilos (Bootstrap + Custom) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - VestIA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👤</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme-neutral.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Header: Navegación principal y accesos rápidos (Cuenta activa) -->
    <header class="header-principal">
        <div class="header-top container py-3">
            <div class="row align-items-center">
                <div class="col-3 col-md-2"><a href="index.html" class="brand-logo">Vest<span class="text-gold">IA</span></a></div>
                <div class="col-6 col-md-7"></div>
                <div class="col-3 col-md-3 d-flex justify-content-end align-items-center gap-4">
                    <a href="profile.html" class="icon-link active text-decoration-none">
                        <i class="fa-regular fa-user"></i><span>Cuenta</span>
                    </a>
                    <a href="cart.html" class="icon-link position-relative" id="btn-carrito">
                        <i class="fa-solid fa-cart-shopping"></i><span>Mi Carrito</span>
                        <span id="cart-count" class="badge rounded-pill bg-gold position-absolute top-0 start-100 translate-middle">0</span>
                    </a>
                </div>
            </div>
        </div>
        <div class="header-bottom border-top border-bottom">
            <nav class="container d-flex justify-content-center">
                <ul class="nav-links-clean">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="products.html">Catálogo</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Contenedor principal: Tarjeta de datos del usuario -->
                <div class="card border-0 shadow-lg p-4">
                    <h3 class="text-center mb-4 fw-bold text-gold">Mis Datos</h3>
                    <p class="text-center text-muted mb-4">Actualiza tu información para que Vestie conozca tus tallas exactas.</p>
                    
                    <!-- Formulario de Preferencias (Nombre, Género y Tallas) -->
                    <form id="form-perfil">
                        <div class="mb-4">
                            <label for="nombre" class="form-label fw-bold">Tu Nombre</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej: María" required>
                        </div>

                        <div class="mb-4">
                            <label for="genero" class="form-label fw-bold">Género</label>
                            <select id="genero" class="form-select">
                                <option value="Todos">Prefiero ver todo</option>
                                <option value="Dama">Dama</option>
                                <option value="Caballero">Caballero</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="talla_ropa" class="form-label fw-bold">Talla de Ropa (Camisas/Pantalones)</label>
                            <select id="talla_ropa" class="form-select">
                                <option value="S">S (Pequeña)</option>
                                <option value="M">M (Mediana)</option>
                                <option value="L">L (Grande)</option>
                                <option value="XL">XL (Extra Grande)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="talla_calzado" class="form-label fw-bold">Talla de Calzado</label>
                            <select id="talla_calzado" class="form-select">
                                <option value="36">36</option>
                                <option value="37">37</option>
                                <option value="38">38</option>
                                <option value="39">39</option>
                                <option value="40">40</option>
                                <option value="41">41</option>
                                <option value="42">42</option>
                                <option value="43">43</option>
                                <option value="44">44</option>
                                <option value="45">45</option>
                            </select>
                        </div>

                        <!--Botón de acción: Guarda datos (conecta con profile.js) -->
                        <button type="button" class="btn btn-primary w-100 py-2 fw-bold" onclick="guardarPreferencias()">Guardar Datos</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Contenedor para notificaciones flotantes (Toasts) -->
    <div id="toast-notification"></div>

    <!-- Footer simplificado -->
    <footer class="footer-elegant">
        <div class="container py-5 text-center">
            <p class="text-white-50 m-0">© 2025 VestIA Boutique</p>
        </div>
    </footer>

    <!-- Scripts: Configuración y lógica específica del perfil -->
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
